<!--
  Confirmation email (A-06).

  Links to the application's own /auth/confirm route with a token hash rather
  than through the Auth verify endpoint's PKCE flow, so the link still works
  when the message is opened on a different device from the one that signed up.
-->
<h2>Confirm your AutoLinkX account</h2>
<p>Open the link below to finish creating your account.</p>
<p>
  <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email">
    Confirm my account
  </a>
</p>
<p>If you did not create an account, you can ignore this message.</p>
