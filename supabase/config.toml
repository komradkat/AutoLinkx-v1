# Ports are offset from the Supabase defaults (544xx instead of 543xx) so this
# stack can run beside another local Supabase project on the same machine.
project_id = "autolinkx"
[api]
enabled = true
port = 54421
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
[db]
port = 54422
shadow_port = 54420
major_version = 17
[db.seed]
enabled = false
[studio]
enabled = true
port = 54423
# Local mail capture (Mailpit). Replaces the deprecated [inbucket] section.
[local_smtp]
enabled = true
port = 54424
[storage]
enabled = true
file_size_limit = "6MiB"
[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/confirm", "http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_signup = true
minimum_password_length = 12
[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true

# Templates link to the application's own auth routes with a token hash, so a
# link opened on another device still works.
[auth.email.template.confirmation]
subject = "Confirm your AutoLinkX account"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Choose a new AutoLinkX password"
content_path = "./supabase/templates/recovery.html"
[analytics]
enabled = false
